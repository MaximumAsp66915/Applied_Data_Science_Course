<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUT Music — Preview</title>
<style>
  :root {
    --bg-1: #0E0C15;
    --bg-2: #17131F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 65%);
    color: #F4F1FA;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }
  h1 {
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9891B0;
    font-weight: 700;
    margin: 0 0 48px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 64px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .label {
    font-size: 13px;
    color: #9891B0;
    font-weight: 600;
  }

  /* iPhone 15/16 Pro Max — real ratio 77.6mm x 163mm, screen 430x932pt */
  .phone {
    width: 387px;
    height: 812px;
    background: #050505;
    border-radius: 64px;
    padding: 12px;
    position: relative;
    box-shadow:
      inset 0 0 0 2px #3a3a3a,
      inset 0 0 0 5px #050505,
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 10px 24px -10px rgba(0,0,0,0.6);
  }

  /* side buttons */
  .btn { position: absolute; background: #050505; border: 1px solid #2c2c2c; }
  .btn-mute {
    left: -3px; top: 168px; width: 4px; height: 32px; border-radius: 2px 0 0 2px;
  }
  .btn-vol-up {
    left: -3px; top: 224px; width: 4px; height: 56px; border-radius: 2px 0 0 2px;
  }
  .btn-vol-down {
    left: -3px; top: 292px; width: 4px; height: 56px; border-radius: 2px 0 0 2px;
  }
  .btn-power {
    right: -3px; top: 240px; width: 4px; height: 84px; border-radius: 0 2px 2px 0;
  }

  .screen {
    width: 100%;
    height: 100%;
    border-radius: 52px;
    overflow: hidden;
    position: relative;
    background: #14121C;
  }

  /* Dynamic island */
  .island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 32px;
    background: #000;
    border-radius: 18px;
    z-index: 10;
  }

  /* content sits below the island so the app UI is never covered */
  .content {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }
  .content iframe {
    width: 100%;
    height: calc(100% + 58px);
    margin-top: -58px;
    border: 0;
    display: block;
  }

  /* home indicator bar */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(244,241,250,0.35);
    z-index: 10;
  }
</style>
</head>
