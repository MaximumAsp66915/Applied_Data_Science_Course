<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Preview</title>
  <link rel="stylesheet" href="device-preview.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <select class="device-picker" id="devicePicker" aria-label="Select device preview">
    <option value="iphone-17-pro-max">iPhone 17 Pro Max</option>
    <option value="s24-ultra">Samsung S24 Ultra</option>
    <option value="s26-ultra">Samsung S26 Ultra</option>
    <option value="z-fold-7">Galaxy Z Fold 7 (foldable)</option>
    <option value="z-flip-7">Galaxy Z Flip 7 (foldable)</option>
    <option value="ipad-pro">iPad Pro</option>
    <option value="macbook-pro-14">MacBook Pro 14" (laptop)</option>
  </select>

  <div class="demo-clip-page">
    <div class="demo-clip-scene" id="clipScene">
      <!-- Static caption - always reads "SUT MUSIC - DEMO", regardless of
           which device is selected below. -->
      <div class="demo-clip-label" id="deviceLabel">SUT MUSIC - DEMO</div>
      <div class="demo-clip-device" id="deviceScene"></div>
      <div class="demo-clip-hud">
        <div id="caption" class="demo-clip-caption">SUT Music Experience</div>
        <div class="demo-clip-progress" id="progressTrack">
          <div class="demo-clip-progress-fill" id="progressFill"></div>
        </div>
        <div class="demo-clip-controls" id="runningControls" style="display:none">
          <button class="demo-clip-icon-btn" id="prevBtn" title="Previous screen" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
          </button>
          <button class="demo-clip-icon-btn" id="pauseBtn" title="Pause" aria-label="Pause">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="demo-clip-icon-btn" id="muteBtn" title="Mute music" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <button class="demo-clip-icon-btn" id="nextBtn" title="Next screen" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
          </button>
        </div>
        <div id="start-ui">
          <button class="demo-clip-start-btn" id="startBtn">▶ Start demo</button>
        </div>
      </div>
    </div>
  </div>
  <script src="device-preview.js"></script>
  <script>
    const labelEl = document.getElementById('deviceLabel');
    const deviceRoot = document.getElementById('deviceScene');
    const caption = document.getElementById('caption');
    const startUI = document.getElementById('start-ui');
    const startBtn = document.getElementById('startBtn');
    const runningControls = document.getElementById('runningControls');
    const pauseBtn = document.getElementById('pauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');

    const params = new URLSearchParams(window.location.search);
    const deviceKey = params.get('device') || 'iphone-17-pro-max';
    const pagePath = params.get('page') || '../pages/demo-home.html';
    const devicePicker = document.getElementById('devicePicker');
    devicePicker.value = deviceKey;

    devicePicker.addEventListener('change', () => {
      const url = new URL(window.location.href);
      url.searchParams.set('device', devicePicker.value);
      window.location.href = url.toString();
    });

    // Sizing of the device itself is pure CSS (no JS fit-to-container
    // scaling) - see the note above setDevicePreviewLayout in
    // device-preview.js. The `phone.style.transform` calls below are a
    // deliberate cinematic pan/zoom effect layered on top, not a
    // container-fit calculation, so they don't fight browser zoom the
    // way the old fit logic did.
    const { shell: phone } = window.devicePreview.setDevicePreviewLayout(deviceRoot, labelEl, deviceKey, pagePath, {
      staticLabel: 'SUT MUSIC - DEMO'
    });

    const STEP_MS = 4000;
    const sequence = [
      { url: '../pages/demo-home.html', label: 'Home Feed', cam: 'rotateY(0deg) rotateX(0deg) scale(1)', stageT: 'translateZ(0px)' },
      { url: '../pages/demo-suggest.html', label: 'AI Suggestions', cam: 'rotateY(-12deg) rotateX(4deg) scale(1.06)', stageT: 'translateX(40px) translateZ(60px)' },
      { url: '../pages/demo-song.html', label: 'Now Playing', cam: 'rotateY(12deg) rotateX(-4deg) scale(1.04)', stageT: 'translateX(-40px) translateZ(30px)' },
      { url: '../pages/demo-song-details.html', label: 'Track Analytics', cam: 'rotateY(0deg) rotateX(10deg) scale(1.06)', stageT: 'translateY(-60px) translateZ(80px)' },
      { url: '../pages/demo-artist.html', label: 'Artist Profiles', cam: 'rotateY(-8deg) rotateX(-3deg) scale(1)', stageT: 'translateX(20px) translateZ(0px)' },
      { url: '../pages/demo-ranks.html', label: 'Global Rankings', cam: 'rotateY(8deg) rotateX(3deg) scale(1.06)', stageT: 'translateX(-20px) translateZ(60px)' },
      { url: '../pages/demo-search.html', label: 'Smart Search', cam: 'rotateY(0deg) rotateX(0deg) scale(1.1)', stageT: 'translateZ(110px)' },
      { url: '../pages/demo-profile.html', label: 'User Progression', cam: 'rotateY(0deg) rotateX(0deg) scale(1)', stageT: 'translateZ(0px)' }
    ];

    let step = 0;
    let timer = null;
    let paused = false;
    let running = false;

    function goTo(newStep, restartTimer = true) {
      step = ((newStep % sequence.length) + sequence.length) % sequence.length;
      const data = sequence[step];
      const frame = deviceRoot.querySelector('iframe');
      if (frame) {
        frame.style.opacity = '0';
      }
      caption.classList.remove('active');
      progressFill.classList.remove('animate');
      progressFill.style.width = '0%';

      setTimeout(() => {
        if (frame) {
          frame.src = data.url;
          frame.style.opacity = '1';
        }
        caption.innerText = data.label;
        caption.classList.add('active');
        phone.style.transform = data.cam;
        deviceRoot.style.transform = data.stageT;
        requestAnimationFrame(() => {
          progressFill.classList.add('animate');
          progressFill.style.width = '100%';
        });
      }, 320);

      if (restartTimer) resetTimer();
    }

    function resetTimer() {
      clearInterval(timer);
      if (!paused && running) {
        timer = setInterval(() => goTo(step + 1, false), STEP_MS);
      }
    }

    function setPaused(v) {
      paused = v;
      pauseBtn.innerHTML = paused ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      if (paused) {
        clearInterval(timer);
        progressFill.style.transition = 'none';
      } else {
        resetTimer();
      }
    }

    function start() {
      running = true;
      startUI.style.display = 'none';
      runningControls.style.display = 'flex';
      progressTrack.classList.add('visible');
      goTo(0);
    }

    startBtn.addEventListener('click', start);
    pauseBtn.addEventListener('click', () => setPaused(!paused));
    nextBtn.addEventListener('click', () => goTo(step + 1));
    prevBtn.addEventListener('click', () => goTo(step - 1));
    muteBtn.addEventListener('click', () => { muteBtn.style.opacity = muteBtn.style.opacity === '0.4' ? '1' : '0.4'; });

    document.addEventListener('keydown', (e) => {
      if (!running) return;
      if (e.key === 'ArrowRight') goTo(step + 1);
      if (e.key === 'ArrowLeft') goTo(step - 1);
      if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
    });
  </script>
</body>
</html>
