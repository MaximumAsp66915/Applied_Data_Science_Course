<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SUT Music — Suggest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#14121C',
        surface: '#1E1B29',
        raised: '#272335',
        line: '#322D45',
        muted: '#9891B0',
        paper: '#F4F1FA',
        brand: { DEFAULT: '#7C5CFC', dim: '#5B3FE0', glow: '#A78BFA' },
        pulse: { DEFAULT: '#FFB454', dim: '#B9803A' },
        rasp: { DEFAULT: '#FB6F92', dim: '#B24E68' },
      },
      fontFamily: {
        display: ["'Fraunces'", "serif"],
        sans: ["'Manrope'", "sans-serif"],
        mono: ["'JetBrains Mono'", "monospace"],
      },
      borderRadius: { xl2: '1.25rem' },
      boxShadow: {
        soft: '0 8px 30px -10px rgba(0,0,0,0.45)',
        glow: '0 0 0 1px rgba(124,92,252,0.35), 0 8px 24px -8px rgba(124,92,252,0.45)',
      },
      keyframes: {
        pulseBar: { '0%, 100%': { transform: 'scaleY(0.4)' }, '50%': { transform: 'scaleY(1)' } },
        floatUp: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
      },
      animation: {
        pulseBar: 'pulseBar 1.1s ease-in-out infinite',
        floatUp: 'floatUp 0.4s ease-out both',
      },
    }
  }
}
</script>
<style>
  ::-webkit-scrollbar { display: none; }
  body { -ms-overflow-style: none; scrollbar-width: none; }
  .rail { scrollbar-width: none; -ms-overflow-style: none; }
  .rail::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-ink text-paper font-sans antialiased min-h-screen">
<div class="max-w-md mx-auto min-h-screen relative bg-ink overflow-hidden">

<div class="min-h-screen flex flex-col px-6 pt-4 pb-10">
  <div class="flex items-center gap-3">
    <button class="w-9 h-9 rounded-full bg-surface flex items-center justify-center active:scale-[0.97] transition-transform duration-150" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <h1 class="font-display text-lg text-paper">Suggest me a song</h1>
  </div>

  <div class="flex-1 flex flex-col items-center justify-center text-center">
    <div class="w-full max-w-xs animate-floatUp">
      <div class="aspect-square w-full">
        <div class="bg-raised rounded-xl2 overflow-hidden shrink-0 flex items-center justify-center border border-line/60 w-full h-full">
          <img src=https://kimi-web-img.kimi.ai/img/www.booksmithstudio.com/047d0a0f492b417c45deea689d0ed5dc630b6c6b.webp alt="" class="w-full h-full object-cover" />
        </div>
      </div>
      <h2 class="font-display text-xl text-paper mt-5">After Hours</h2>
      <p class="text-sm text-muted mt-1">The Weeknd</p>
      <p class="text-xs text-brand-glow mt-2 bg-brand/10 rounded-full inline-block px-3 py-1">
        Because you liked Blinding Lights
      </p>
      <div class="mt-6 flex gap-2.5">
        <button class="flex-1 bg-brand text-white font-semibold text-sm py-3 rounded-xl2 active:scale-[0.97] transition-transform duration-150">
          Play it
        </button>
        <button class="flex-1 bg-raised text-paper font-semibold text-sm py-3 rounded-xl2 border border-line/60 active:scale-[0.97] transition-transform duration-150">
          Try another
        </button>
      </div>
    </div>
  </div>
</div>
</div></body></html>
