<title>SUT Music — Preview</title>
<style>
  html, body {
    margin: 0;
    /* Full SIZE of the page (fills the real document box), not "full
       screen" via 100vw/100vh - those units track the browser's visual
       viewport and shrink/resize as the user pinches or zooms, which is
       what was pushing the page's content down/around during zoom.
       100% here fills the parent box and simply scales up in place when
       the browser itself is zoomed. */
    width: 100%;
    height: 100%;
    background: #0E0C15;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .preview-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #0E0C15;
  }
</style>
</head>
<body>
  <iframe class="preview-frame" src="device/index.html?device=iphone-17-pro-max&page=../pages/demo-home.html"></iframe>
</body>
